name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  MSRV: "1.88.0"
  RUST_BACKTRACE: "1"
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  msrv:
    name: ubuntu-24.04 / msrv
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: target/msrv

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/msrv
          key: ${{ runner.os }}-cargo-msrv-${{ env.MSRV }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-${{ env.MSRV }}-
            ${{ runner.os }}-cargo-msrv-

      - name: Check default feature graph
        run: cargo check --locked --all-targets

      - name: Check all-features lib graph
        run: cargo check --locked --all-features --lib

  check:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026]
        toolchain: [stable]

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-downloads-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-downloads-

      - name: Cache build outputs
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-${{ matrix.toolchain }}-

      - name: Format
        if: matrix.os == 'ubuntu-24.04'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: No production panics
        run: cargo clippy --locked --lib --bins -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::indexing_slicing -D clippy::panic

      - name: Docs
        if: matrix.os == 'ubuntu-24.04'
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --locked --release

  all-features:
    name: ubuntu-24.04 / stable / all-features
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: target/all-features

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/all-features
          key: ${{ runner.os }}-cargo-all-features-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-all-features-
            ${{ runner.os }}-cargo-

      - name: Clippy all-features
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: No production panics all-features
        run: cargo clippy --locked --lib --bins --all-features -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::indexing_slicing -D clippy::panic

      - name: Docs all-features
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --no-deps --all-features

      - name: Test all-features lib
        run: cargo test --locked --all-features --lib

      - name: Smoke all-features embeddings contract
        env:
          CARGO_BUILD_JOBS: 1
        run: cargo test --locked --all-features --test json_contract_snapshots index_embeddings_feature_awaits_consent_without_download -- --nocapture

  supply-chain:
    name: ubuntu-24.04 / supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      ACTIONLINT_VERSION: "1.7.12"
      CARGO_DENY_VERSION: "0.19.6"
      CARGO_MACHETE_VERSION: "0.9.2"

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-supply-chain-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-supply-chain-
            ${{ runner.os }}-cargo-

      - name: Cache Rust audit tools
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-machete
          key: ${{ runner.os }}-cargo-audit-tools-deny-${{ env.CARGO_DENY_VERSION }}-machete-${{ env.CARGO_MACHETE_VERSION }}

      - name: Install Rust audit tools
        run: |
          if ! command -v cargo-deny >/dev/null || ! cargo-deny --version | grep -qx "cargo-deny ${CARGO_DENY_VERSION}"; then
            cargo install --locked cargo-deny --version "${CARGO_DENY_VERSION}"
          fi
          if ! command -v cargo-machete >/dev/null || ! cargo-machete --version | grep -qx "${CARGO_MACHETE_VERSION}"; then
            cargo install --locked cargo-machete --version "${CARGO_MACHETE_VERSION}"
          fi

      - name: Install actionlint
        run: |
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz$" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      - name: Check advisories licenses bans and sources
        run: |
          mkdir -p target/deny
          cargo metadata --locked --format-version 1 > target/deny/default.json
          cargo deny check --metadata-path target/deny/default.json --hide-inclusion-graph -A advisory-not-detected -A unmatched-skip
          cargo metadata --locked --format-version 1 --all-features > target/deny/all-features.json
          cargo deny check --metadata-path target/deny/all-features.json --hide-inclusion-graph

      - name: Check unused dependencies
        run: cargo machete --with-metadata

      - name: Lint GitHub Actions workflows
        run: actionlint

  release-dry-run:
    name: ${{ matrix.os }} / release dry-run
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026]

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-release-downloads-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-downloads-

      - name: Cache release build outputs
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-release-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-target-

      - name: Build self-updating release binary
        run: cargo build --locked --release --features self-update

      - name: Smoke local archive install and uninstall
        shell: bash
        run: bash scripts/smoke-release-install.sh --tag v0.0.0-ci
