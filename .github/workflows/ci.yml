name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  check:
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025-vs2026]
        toolchain: [stable]

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.toolchain }}-
            ${{ runner.os }}-cargo-

      - name: Format
        if: matrix.os == 'ubuntu-24.04'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

  all-features:
    name: ubuntu-24.04 / stable / all-features
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-all-features-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-all-features-
            ${{ runner.os }}-cargo-

      - name: Clippy all-features
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test all-features lib
        run: cargo test --all-features --lib

  supply-chain:
    name: ubuntu-24.04 / supply-chain
    runs-on: ubuntu-24.04

    env:
      ACTIONLINT_VERSION: "1.7.12"
      CARGO_DENY_VERSION: "0.19.6"
      CARGO_MACHETE_VERSION: "0.9.2"

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-supply-chain-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-supply-chain-
            ${{ runner.os }}-cargo-

      - name: Install Rust audit tools
        run: |
          cargo install --locked cargo-deny --version "${CARGO_DENY_VERSION}"
          cargo install --locked cargo-machete --version "${CARGO_MACHETE_VERSION}"

      - name: Install actionlint
        run: |
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz$" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      - name: Check advisories licenses bans and sources
        run: |
          mkdir -p target/deny
          cargo metadata --format-version 1 > target/deny/default.json
          cargo deny check --metadata-path target/deny/default.json --hide-inclusion-graph -A advisory-not-detected
          cargo metadata --format-version 1 --all-features > target/deny/all-features.json
          cargo deny check --metadata-path target/deny/all-features.json --hide-inclusion-graph

      - name: Check unused dependencies
        run: cargo machete

      - name: Lint GitHub Actions workflows
        run: actionlint

  release-dry-run:
    name: ubuntu-24.04 / release dry-run
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-dry-run-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-dry-run-
            ${{ runner.os }}-cargo-

      - name: Build self-updating release binary
        run: cargo build --release --features self-update

      - name: Smoke local archive install and uninstall
        run: bash scripts/smoke-release-install.sh --tag v0.0.0-ci
