name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_DENY_VERSION: "0.19.6"
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  preflight:
    name: ubuntu-24.04 / release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: target/release-preflight
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release-preflight
          key: ${{ runner.os }}-cargo-release-preflight-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-preflight-
            ${{ runner.os }}-cargo-

      - name: Cache cargo-deny
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-${{ env.CARGO_DENY_VERSION }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Install cargo-deny
        run: |
          if ! command -v cargo-deny >/dev/null || ! cargo-deny --version | grep -qx "cargo-deny ${CARGO_DENY_VERSION}"; then
            cargo install --locked cargo-deny --version "${CARGO_DENY_VERSION}"
          fi

      - name: Check advisories licenses bans and sources
        run: |
          mkdir -p target/deny
          cargo metadata --locked --format-version 1 > target/deny/default.json
          cargo deny check --metadata-path target/deny/default.json --hide-inclusion-graph -A advisory-not-detected -A unmatched-skip
          cargo metadata --locked --format-version 1 --all-features > target/deny/all-features.json
          cargo deny check --metadata-path target/deny/all-features.json --hide-inclusion-graph

  build:
    name: ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            os: windows-2025-vs2026
          - target: aarch64-apple-darwin
            os: macos-15

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-release-downloads-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-downloads-

      - name: Cache release build outputs
        uses: actions/cache@v5
        with:
          path: target/${{ matrix.target }}
          key: ${{ runner.os }}-cargo-release-target-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-target-${{ matrix.target }}-

      - name: Build
        run: cargo build --locked --release --features self-update --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          scripts/package-release.sh \
            --target "${{ matrix.target }}" \
            --tag "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --out-dir "$PWD"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: aghist-${{ matrix.target }}
          path: aghist-${{ github.ref_name }}-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: aghist-*
