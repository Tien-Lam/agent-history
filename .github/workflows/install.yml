name: Install Script

on:
  push:
    branches: [main]
    paths:
      - install.sh
      - scripts/package-release.sh
      - scripts/smoke-release-install.sh
      - .github/workflows/install.yml
  pull_request:
    branches: [main]
    paths:
      - install.sh
      - scripts/package-release.sh
      - scripts/smoke-release-install.sh
      - .github/workflows/install.yml

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  test-install:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh scripts/package-release.sh scripts/smoke-release-install.sh

      - name: Build release binary
        run: cargo build --locked --release --features self-update

      - name: Smoke local archive install and uninstall
        run: bash scripts/smoke-release-install.sh --tag v0.0.0-install-ci
