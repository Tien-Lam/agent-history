name: Install Script

on:
  push:
    branches: [main]
    paths:
      - install.sh
      - scripts/package-release.sh
      - scripts/smoke-release-install.sh
      - .github/workflows/install.yml
  pull_request:
    branches: [main]
    paths:
      - install.sh
      - scripts/package-release.sh
      - scripts/smoke-release-install.sh
      - .github/workflows/install.yml

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  test-install:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh scripts/package-release.sh scripts/smoke-release-install.sh

      - name: Check shell argument validation
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail

          bash install.sh --help >/dev/null
          bash scripts/package-release.sh --help >/dev/null
          bash scripts/smoke-release-install.sh --help >/dev/null

          if bash scripts/package-release.sh --target >out.txt 2>err.txt; then
            echo "package-release accepted a missing --target operand" >&2
            exit 1
          fi
          grep -q "Error: --target requires a non-empty TARGET" err.txt

          if bash scripts/smoke-release-install.sh --tag >out.txt 2>err.txt; then
            echo "smoke-release-install accepted a missing --tag operand" >&2
            exit 1
          fi
          grep -q "Error: --tag requires a non-empty TAG" err.txt

          if bash scripts/package-release.sh --target x86_64-unknown-linux-gnu --tag ../bad --out-dir "$RUNNER_TEMP" >out.txt 2>err.txt; then
            echo "package-release accepted an unsafe --tag value" >&2
            exit 1
          fi
          grep -q "unsafe archive filename" err.txt

          if bash scripts/package-release.sh --target ../bad --tag v0.0.0 --out-dir "$RUNNER_TEMP" >out.txt 2>err.txt; then
            echo "package-release accepted an unsafe --target value" >&2
            exit 1
          fi
          grep -q "unsafe archive filename" err.txt

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf '#!/usr/bin/env sh\nprintf "fake aghist\\n"\n' > "$tmp/aghist"
          chmod +x "$tmp/aghist"
          printf 'method=github-release\n' > "$tmp/aghist.install"
          (cd "$tmp" && tar czf "$tmp/valid.tar.gz" aghist aghist.install)
          if bash install.sh --to "$tmp/bin" --tag ../bad --archive "$tmp/valid.tar.gz" >out.txt 2>err.txt; then
            echo "install.sh accepted an unsafe --tag value" >&2
            exit 1
          fi
          grep -q "release tag contains unsafe characters" err.txt

      - name: Check install archive validation
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          printf '#!/usr/bin/env sh\nprintf "fake aghist\\n"\n' > "$tmp/aghist"
          chmod +x "$tmp/aghist"
          printf 'method=github-release\n' > "$tmp/aghist.install"

          (cd "$tmp" && tar czf "$tmp/valid.tar.gz" aghist aghist.install)
          bash install.sh --to "$tmp/bin" --tag v0.0.0-validation --archive "$tmp/valid.tar.gz" >/dev/null
          test -x "$tmp/bin/aghist"

          if env -u HOME bash install.sh --tag v0.0.0-validation --archive "$tmp/valid.tar.gz" >"$tmp/out" 2>"$tmp/err"; then
            echo "install.sh accepted a missing HOME without --to" >&2
            exit 1
          fi
          grep -q "could not determine default install directory because HOME is unset" "$tmp/err"

          printf 'unexpected\n' > "$tmp/extra"
          (cd "$tmp" && tar czf "$tmp/invalid.tar.gz" aghist aghist.install extra)
          if bash install.sh --to "$tmp/invalid-bin" --tag v0.0.0-validation --archive "$tmp/invalid.tar.gz" >"$tmp/out" 2>"$tmp/err"; then
            echo "install.sh accepted an archive with unexpected members" >&2
            exit 1
          fi
          grep -q "archive contains unexpected member: extra" "$tmp/err"
          test ! -e "$tmp/invalid-bin/aghist"

          (cd "$tmp" && tar czf "$tmp/duplicate.tar.gz" aghist aghist aghist.install)
          if bash install.sh --to "$tmp/duplicate-bin" --tag v0.0.0-validation --archive "$tmp/duplicate.tar.gz" >"$tmp/out" 2>"$tmp/err"; then
            echo "install.sh accepted an archive with duplicate binary entries" >&2
            exit 1
          fi
          grep -q "archive must contain exactly one aghist" "$tmp/err"
          test ! -e "$tmp/duplicate-bin/aghist"

          mkdir -p "$tmp/symlink-bin"
          printf 'do not overwrite\n' > "$tmp/target"
          ln -s "$tmp/target" "$tmp/symlink-bin/aghist"
          if bash install.sh --to "$tmp/symlink-bin" --tag v0.0.0-validation --archive "$tmp/valid.tar.gz" >"$tmp/out" 2>"$tmp/err"; then
            echo "install.sh overwrote a symlinked binary destination" >&2
            exit 1
          fi
          grep -q "refusing to overwrite symlinked binary destination" "$tmp/err"
          grep -qx "do not overwrite" "$tmp/target"

      - name: Build release binary
        run: cargo build --locked --release --features self-update

      - name: Smoke local archive install and uninstall
        run: bash scripts/smoke-release-install.sh --tag v0.0.0-install-ci
