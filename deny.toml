[graph]
all-features = true
targets = [
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "reviewed: 2026-05-24; next-review: 2026-11-24; upstream: fastembed/tokenizers; transitive via optional embeddings; no patched upstream path yet." },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
    { crate = "base64@0.13.1", reason = "reviewed: 2026-05-24; next-review: 2026-11-24; upstream: fastembed/tokenizers; transitive through spm_precompiled; direct deps use base64 0.22." },
    { crate = "darling@0.20.11", reason = "reviewed: 2026-05-24; next-review: 2026-11-24; upstream: fastembed/tokenizers; transitive through derive_builder while Tantivy uses darling 0.23." },
    { crate = "darling_core@0.20.11", reason = "reviewed: 2026-05-24; next-review: 2026-11-24; upstream: fastembed/tokenizers; transitive through derive_builder while Tantivy uses darling 0.23." },
    { crate = "darling_macro@0.20.11", reason = "reviewed: 2026-05-24; next-review: 2026-11-24; upstream: fastembed/tokenizers; transitive through derive_builder while Tantivy uses darling 0.23." },
    { crate = "getrandom@0.2.17", reason = "reviewed: 2026-05-24; next-review: 2026-11-24; upstream: rustls/ring; transitive through rustls/ring; newer getrandom versions also arrive through tokenizers and tempfile." },
    { crate = "getrandom@0.4.2", reason = "reviewed: 2026-05-24; next-review: 2026-11-24; upstream: tempfile/uuid; transitive through tempfile/uuid; older getrandom versions remain in rustls and tokenizers trees." },
    { crate = "windows-sys@0.52.0", reason = "reviewed: 2026-05-24; next-review: 2026-11-24; upstream: self_update/self-replace; transitive through Windows release paths." },
    { crate = "windows-sys@0.59.0", reason = "reviewed: 2026-05-24; next-review: 2026-11-24; upstream: arboard/tantivy/fs4; transitive through arboard and Tantivy/fs4 until those dependency trees converge." },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
